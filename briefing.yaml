# Ablegen unter: .github/workflows/briefing.yml
# Cron läuft in UTC: 06:00 (Sommerzeit) und 07:00 (Winterzeit).
# Das Skript läuft nur, wenn es in Berlin gerade 8 Uhr ist.
name: Marktbriefing
on:
  schedule:
    - cron: "0 6 * * 1-5"
    - cron: "0 7 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests yfinance
      - run: python market_briefing.py
        env:
          CI: "true"
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Webseite committen
        run: |
          git config user.name "briefing-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Briefing $(date +%F)" && git push)
